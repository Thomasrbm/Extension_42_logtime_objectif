<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>42 Logtime</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

<div class="view">
  <header class="top">
    <span class="label">objectif</span>
    <span id="goal-display" class="goal">config requise</span>

    <button id="btn-settings" class="icon-btn">
      ⚙
    </button>
  </header>

  <main class="center">
    <div id="delta" class="delta">
      <span id="delta-sign" class="sign">·</span>
      <span id="delta-value">--</span>
      <span class="unit">h</span>
    </div>

    <div id="status-label" class="status">
      —
    </div>
  </main>

  <aside class="side">
    <div class="side-line">
      <span class="k">par jour</span>
      <span id="daily-target" class="v">— h</span>
    </div>

    <div class="side-line">
      <span class="k">fait</span>
      <span id="done" class="v">— h</span>
    </div>

    <div class="side-line">
      <span class="k">attendu</span>
      <span id="expected" class="v">— h</span>
    </div>
  </aside>

  <footer class="bot">
    <span id="last-sync" class="muted">—</span>

    <button id="btn-refresh" class="text-btn">
      refresh
    </button>
  </footer>
</div>

<script src="popup.js"></script>
</body>
</html>
